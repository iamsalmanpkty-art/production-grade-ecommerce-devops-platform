name: Test EC2 Connectivity

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      - name: Test Port 22
        run: |
          nc -vz ${{ secrets.EC2_HOST }} 22

