name: Debug Secrets

on:
  push:
    branches:
      - main

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check host exists
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST is EMPTY"
            exit 1
          else
            echo "EC2_HOST exists"
          fi

      - name: Check user exists
        run: |
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "EC2_USER is EMPTY"
            exit 1
          else
            echo "EC2_USER exists"
          fi

      - name: Check key exists
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "EC2_SSH_KEY is EMPTY"
            exit 1
          else
            echo "EC2_SSH_KEY exists"
          fi
